[project]
name = "model-gateway"
version = "0.1.0"
requires-python = ">=3.12"
# Точные == для прямых зависимостей: детерминизм при отсутствии
# uv.lock в репозитории. Транзитивные зависимости разрешаются uv
# с учётом exclude-newer = "7 days" (cooldown).
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.30.6",
    "httpx==0.27.2",
    "PyYAML==6.0.2",
    "cryptography==43.0.3",
]

[tool.uv]
exclude-newer = "7 days"
