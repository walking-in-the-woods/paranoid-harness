worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    access_log off;
    server_tokens off;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    client_max_body_size 1048576;
    client_body_buffer_size 128k;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 600s;

    # Nginx-буферы построения запроса к upstream. Размер исходящего
    # X-Client-Cert (~3 KB URL-encoded) укладывается в дефолтные 8 KB.
    proxy_buffer_size 16k;
    proxy_buffers 4 16k;
    proxy_busy_buffers_size 32k;
    proxy_headers_hash_max_size 4096;
    proxy_headers_hash_bucket_size 128;

    # Сертификат 4096-bit + URL-encode + другие заголовки.
    large_client_header_buffers 4 32k;
    client_header_buffer_size 16k;

    upstream model_gateway {
        server model-gateway:8080;
        keepalive 16;
    }

    # Локальный HTTP-порт для healthcheck.
    server {
        listen 127.0.0.1:8081;
        location = /health {
            return 200 "ok\n";
        }
        location / { return 404; }
    }

    server {
        listen 8443 ssl;
        http2 on;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_client_certificate /certs/ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 2;

        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;

        # X-Real-IP из $remote_addr; XFF не пробрасываем.
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;

        # Пробрасываем САМ СЕРТИФИКАТ, не CN. Python верифицирует
        # подпись через cryptography. X-Client-Verify — defense-in-depth:
        # гейтвей проверяет == SUCCESS до верификации подписи.
        proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-Client-Verify $ssl_client_verify;

        # Явно чистим всё, что клиент мог прислать.
        proxy_set_header X-Client-CN "";
        proxy_set_header Authorization "";

        location / {
            proxy_pass http://model_gateway;
            proxy_http_version 1.1;

            proxy_request_buffering on;
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            proxy_set_header Upgrade "";
            proxy_set_header Connection "";
        }
    }
}
