site_name: Local AI Harness
site_description: Изолированный локальный агент на Ollama
site_url: ""
use_directory_urls: true

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang: ru
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_if_no_docstring: false
            members_order: source
            separate_signature: true
            signature_crossrefs: true
            show_signature_annotations: true
            docstring_style: google
            docstring_section_style: table
            merge_init_into_class: true

nav:
  - Обзор: index.md
  - Начало работы:
      - Установка: install.md
      - Быстрый старт: cheatsheet.md
  - Использование:
      - Базовый сценарий: usage.md
      - Рецепты: cookbook.md
      - Политики доступа: policies.md
      - Внешние API: api-proxy.md
      - Диагностика: troubleshooting.md
      - Глоссарий: glossary.md
  - Эксплуатация:
      - Модель угроз: security-model.md
      - Operations: operations.md
      - Совместимость: compatibility.md
  - Разработка:
      - Архитектура: architecture.md
      - Тесты и CI: development.md
      - Design notes: design-notes.md
      - API reference:
          - fs_guard: reference/fs_guard.md
          - injection_guard: reference/injection_guard.md
          - agent_loop: reference/agent_loop.md
          - confirm: reference/confirm.md
          - audit: reference/audit.md
          - proxy: reference/proxy.md
