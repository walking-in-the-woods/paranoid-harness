name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Тестовые модели берутся из repo variables с фолбэком на дефолт.
  # Меняются без правок кода: Settings → Secrets and variables → Actions → Variables.
  SMOKE_MODEL: ${{ vars.SMOKE_MODEL || 'qwen3:1.7b' }}
  SMOKE_MODEL_SMALL: ${{ vars.SMOKE_MODEL_SMALL || 'qwen3:0.6b' }}

jobs:

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            harness/requirements.txt
            requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r harness/requirements.txt
          pip install -r requirements-dev.txt
      - run: pytest tests/ --ignore=tests/smoke -v

  smoke-test:
    name: Smoke test (${{ matrix.model }})
    runs-on: ubuntu-24.04
    needs: unit-tests
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: ${{ vars.SMOKE_MODEL_SMALL || 'qwen3:0.6b' }}
            tool_capable: "false"
          - model: ${{ vars.SMOKE_MODEL || 'qwen3:1.7b' }}
            tool_capable: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            harness/requirements.txt
            requirements-dev.txt
      - name: Start ollama
        run: |
          docker run -d --name ollama -p 11434:11434 ollama/ollama:latest
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::ollama failed to start"
          docker logs ollama
          exit 1
      - name: Pull model
        run: |
          docker exec ollama ollama pull ${{ matrix.model }}
          docker exec ollama ollama list
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r harness/requirements.txt -r requirements-dev.txt
      - name: Run smoke tests
        env:
          OLLAMA_HOST: http://127.0.0.1:11434
          SMOKE_MODEL: ${{ matrix.model }}
          SMOKE_MODEL_SMALL: ${{ matrix.model }}
          SMOKE_TOOL_CAPABLE: ${{ matrix.tool_capable }}
        run: pytest tests/smoke -m smoke -v -s
      - name: Dump ollama logs on failure
        if: failure()
        run: docker logs ollama || true
      - name: Stop ollama
        if: always()
        run: docker rm -f ollama || true
